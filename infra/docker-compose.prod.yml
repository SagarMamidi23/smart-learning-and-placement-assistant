# Single-host production overrides: run the published images on one server you control (for example an EC2 or VPS instance).
# The chosen managed target, Render, does not use this file; see render.yaml and "Deploying to Render" in the README.
# Usage: docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml up -d
services:
  api:
    image: ghcr.io/${GHCR_OWNER}/slp-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
  web:
    image: ghcr.io/${GHCR_OWNER}/slp-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
  ml:
    image: ghcr.io/${GHCR_OWNER}/slp-ml:${IMAGE_TAG:-latest}
    restart: unless-stopped
  mongo:
    ports: []
