global:
  scrape_interval: 15s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: api
    static_configs: [{ targets: ["api:4000"] }]
    # If the API sets METRICS_TOKEN, give Prometheus the same value (mount it as a file; never commit it):
    # authorization: { credentials_file: /etc/prometheus/metrics_token }
  - job_name: ml
    static_configs: [{ targets: ["ml:8000"] }]
