name: CI
on:
  push:
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          {
            python-version: "3.12",
            cache: pip,
            cache-dependency-path: "services/ml/requirements-dev.txt",
          }
      - run: pip install -r services/ml/requirements-dev.txt -r scripts/requirements.txt
      - run: ruff check services/ml scripts
      - name: ML service tests
        run: pytest
        working-directory: services/ml
      - name: Data pipeline tests (fixtures only, no downloads)
        run: pytest
        working-directory: scripts

  docker:
    runs-on: ubuntu-latest
    needs: [node, python]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -f apps/api/Dockerfile -t slp-api .
      - run: docker build -f apps/web/Dockerfile -t slp-web .
      - run: docker build -t slp-ml services/ml
