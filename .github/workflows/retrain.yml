name: Retrain readiness model

# Manual: retrains the readiness model, checks it against a quality gate and publishes the model files and metrics as a downloadable
# artifact. It does not deploy anything. To use a retrained model, rebuild the ML image with it (see "Retraining" in the README).
on:
  workflow_dispatch:
    inputs:
      rows:
        description: Synthetic training rows
        default: "6000"
      seed:
        description: Random seed
        default: "42"
      min_auc:
        description: Fail if the served model's holdout ROC-AUC is below this
        default: "0.75"

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ml/requirements-dev.txt
      - run: pip install -r services/ml/requirements-dev.txt
      - name: Tests
        run: pytest -q
        working-directory: services/ml
      - name: Train
        working-directory: services/ml
        run: |
          python generate_synthetic_data.py --rows "${{ inputs.rows }}" --seed "${{ inputs.seed }}" --out data/synthetic_readiness.csv
          python train.py --data data/synthetic_readiness.csv --out models --seed "${{ inputs.seed }}"
      - name: Quality gate and summary
        working-directory: services/ml
        env:
          MIN_AUC: ${{ inputs.min_auc }}
        run: |
          python - <<'PY'
          import json, os, sys
          m = json.load(open("models/metrics.json"))
          sel = m["selected"]; c = m["candidates"][sel]
          lines = [
              "## Readiness model retrain", "",
              f"Served model: **{sel}** (`{m['model_version']}`)", "",
              f"Data: {m['data']['source']}, {m['data']['rows']} rows ({m['data']['train_rows']} train / {m['data']['test_rows']} holdout)", "",
              "| Model | Accuracy | F1 | ROC-AUC | Brier | Monotone | Servable |", "|---|---|---|---|---|---|---|",
          ]
          for name, r in m["candidates"].items():
              lines.append(f"| {name}{' (served)' if name == sel else ''} | {r['accuracy']} | {r['f1']} | {r['roc_auc']} | {r['brier']} | {r['monotone_ok']} | {r['eligible_to_serve']} |")
          lines += ["", f"> {m['caveat']}"]
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write("\n".join(lines) + "\n")
          floor = float(os.environ["MIN_AUC"])
          if not c["monotone_ok"]:
              sys.exit("Gate failed: served model is not monotone")
          if c["roc_auc"] < floor:
              sys.exit(f"Gate failed: ROC-AUC {c['roc_auc']} is below {floor}")
          print("Gate passed")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: readiness-model-${{ github.run_number }}
          path: |
            services/ml/models/readiness.joblib
            services/ml/models/metrics.json
          retention-days: 90
